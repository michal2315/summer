<div class="head">
  <div class="title" role="heading" aria-level="2">אבני דרך</div>
  @if (loaded()) {
    <span class="count">{{ earnedCount() }}/{{ badges().length }}</span>
  }
</div>

@if (loaded()) {
  <div class="badges" role="list">
    @for (b of badges(); track b.id) {
      <div
        class="badge"
        role="listitem"
        tabindex="0"
        [class.earned]="b.earned"
        [class.fresh]="b.fresh"
        [nz-tooltip]="b.hint"
        [attr.aria-label]="(b.earned ? b.title : 'נעול') + ': ' + b.hint"
      >
        <span class="medal" aria-hidden="true">{{ b.earned ? b.emoji : '🔒' }}</span>
        <span class="name">{{ b.earned ? b.title : '???' }}</span>
        @if (b.fresh) {
          <span class="new">חדש!</span>
        }
      </div>
    }
  </div>
} @else {
  <app-skeleton variant="chips" [count]="badges().length" />
}
