@if (!store.selectMode()) {
  <button nz-button nzSize="small" type="button" appAltKey="selectMode" (click)="store.setSelectMode(true)"><span nz-icon nzType="check-square"></span> בחירה</button>
  @if (excelActions()) {
    <!-- Rarely used: Excel import/templates live behind one overflow button. -->
    <button nz-button nzSize="small" nzType="text" type="button" nz-dropdown [nzDropdownMenu]="more" nzTrigger="click" nz-tooltip="פעולות Excel" aria-label="פעולות Excel">
      <span nz-icon nzType="more"></span>
    </button>
    <nz-dropdown-menu #more="nzDropdownMenu">
      <ul nz-menu>
        <li nz-menu-item (click)="openUpload()"><span nz-icon nzType="upload"></span>&nbsp;העלאת Excel</li>
        <li nz-submenu nzTitle="הורדת תבנית Excel" nzIcon="download">
          <ul>
            @for (t of contentTypes.list(); track t._id) {
              <li nz-menu-item (click)="downloadTemplate(t)">{{ t.displayName }}</li>
            }
          </ul>
        </li>
      </ul>
    </nz-dropdown-menu>
  }
} @else {
  <span class="count" [class.capped]="store.selectedCount() >= store.maxSelection">נבחרו: {{ store.selectedCount() }}</span>
  <button nz-button nzSize="small" nzType="link" type="button" (click)="store.toggleSelectAllLoaded()">בחירת כל המוצגים</button>
  <button nz-button nzSize="small" type="button" [disabled]="!store.selectedCount()" (click)="timeline()"><span nz-icon nzType="field-time"></span> ציר זמן</button>
  <button nz-button nzSize="small" type="button" [disabled]="!store.selectedCount()" (click)="addToCollection()"><span nz-icon nzType="folder-add"></span> הוספה ללקט</button>
  <button nz-button nzSize="small" type="button" [disabled]="!store.selectedCount()" [nzLoading]="exporting()" (click)="export(false)"><span nz-icon nzType="file-excel"></span> ייצוא הנבחרים</button>
  <button nz-button nzSize="small" type="button" [nzLoading]="exporting()" (click)="export(true)" nz-tooltip="כל תוצאות החיפוש הנוכחי">ייצוא הכל</button>
  <button nz-button nzSize="small" type="button" (click)="exportWord()" nz-tooltip="טבלת התמציות עם טקסט משלכם"><span nz-icon nzType="file-word"></span> ייצוא ל-Word</button>
  @if (collection(); as c) {
    <button nz-button nzSize="small" nzDanger type="button" [disabled]="!store.selectedCount()" (click)="removeFromCollection(c)"><span nz-icon nzType="minus-circle"></span> הסרה מהלקט</button>
  }
  <button nz-button nzSize="small" nzType="text" type="button" (click)="store.setSelectMode(false)">ביטול</button>
}
