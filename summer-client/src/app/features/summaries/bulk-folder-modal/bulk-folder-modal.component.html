<div class="muted count">{{ data.summaryIds.length }} תמציות</div>
@if (data.note) {
  <div class="note">{{ data.note }}</div>
}
@if (options(); as list) {
  @if (list.length) {
    <nz-select nzShowSearch nzPlaceHolder="חיפוש תיקייה" [ngModel]="folder()" (ngModelChange)="folder.set($event)" aria-label="תיקייה">
      @for (f of list; track f._id) {
        <nz-option [nzValue]="f._id" [nzLabel]="f.path" />
      }
    </nz-select>
    <div class="muted hint">תמצית שכבר נמצאת בתיקיות אחרות תישאר גם בהן.</div>
  } @else {
    <div class="muted empty">אין תיקיות שאתם מנהלים. אפשר ליצור תיקייה בעמוד ההיררכיה.</div>
  }
} @else {
  <app-skeleton variant="form" [count]="1" />
}
<div class="footer">
  <button nz-button type="button" (click)="modal.close(false)">ביטול</button>
  <button nz-button nzType="primary" type="button" [disabled]="!folder()" [nzLoading]="busy()" (click)="add()">הוספה</button>
</div>
