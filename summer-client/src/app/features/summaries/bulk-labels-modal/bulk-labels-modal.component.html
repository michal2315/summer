<div class="muted count">{{ data.summaryIds.length }} תמציות</div>
@if (data.note) {
  <div class="note">{{ data.note }}</div>
}
<div class="field-label" id="bulk-add-label">הוספת תגיות</div>
<nz-select
  nzMode="tags"
  nzServerSearch
  nzPlaceHolder="הקלידו תגית ולחצו Enter"
  [ngModel]="add()"
  (ngModelChange)="setAdd($event)"
  (nzOnSearch)="query$.next($event)"
  aria-labelledby="bulk-add-label"
>
  @for (l of options(); track l) {
    <nz-option [nzValue]="l" [nzLabel]="l" />
  }
</nz-select>
@if (removeOptions().length) {
  <div class="field-label" id="bulk-remove-label">הסרת תגיות</div>
  <nz-select nzMode="multiple" nzPlaceHolder="תגיות קיימות בתמציות הנבחרות" [ngModel]="remove()" (ngModelChange)="remove.set($event)" aria-labelledby="bulk-remove-label">
    @for (l of removeOptions(); track l) {
      <nz-option [nzValue]="l" [nzLabel]="l" />
    }
  </nz-select>
}
<div class="footer">
  <button nz-button type="button" (click)="modal.close(false)">ביטול</button>
  <button nz-button nzType="primary" type="button" [disabled]="!canApply()" [nzLoading]="busy()" (click)="apply()">עדכון</button>
</div>
