<div class="muted count">{{ data.removeIds.length }} תמציות</div>
<div class="field-label" id="bulk-add-collections">הוספה ללקטים</div>
@if (data.note) {
  <div class="note">{{ data.note }}</div>
}
<nz-select
  nzMode="multiple"
  nzShowSearch
  nzServerSearch
  nzPlaceHolder="חיפוש לקט"
  [nzDisabled]="!data.addIds.length"
  [ngModel]="add()"
  (ngModelChange)="setAdd($event)"
  (nzOnSearch)="query$.next($event)"
  aria-labelledby="bulk-add-collections"
>
  @for (c of options(); track c._id) {
    <nz-option [nzValue]="c._id" [nzLabel]="c.name" />
  }
</nz-select>
@if (removeOptions().length) {
  <div class="field-label" id="bulk-remove-collections">הסרה מלקטים</div>
  <nz-select
    nzMode="multiple"
    nzPlaceHolder="לקטים שהתמציות הנבחרות נמצאות בהם"
    [ngModel]="remove()"
    (ngModelChange)="remove.set($event)"
    aria-labelledby="bulk-remove-collections"
  >
    @for (c of removeOptions(); track c._id) {
      <nz-option [nzValue]="c._id" [nzLabel]="c.name" />
    }
  </nz-select>
  <div class="muted hint">הסרה אפשרית מלקטים שאתם מנהלים.</div>
}
<div class="footer">
  <button nz-button type="button" (click)="modal.close(false)">ביטול</button>
  <button nz-button nzType="primary" type="button" [disabled]="!canApply()" [nzLoading]="busy()" (click)="apply()">עדכון</button>
</div>
