<header class="head">
  @if (editingTitle()) {
    <input nz-input class="title-input" [ngModel]="draftTitle()" (ngModelChange)="draftTitle.set($event)" (keydown.enter)="saveTitle()" (keydown.escape)="editingTitle.set(false)" aria-label="כותרת ציר הזמן" />
    <button nz-button nzType="text" nzShape="circle" type="button" (click)="saveTitle()" aria-label="שמירה"><span nz-icon nzType="check"></span></button>
  } @else {
    <h2>{{ title() }}</h2>
    @if (isMine) {
      <button nz-button nzType="text" nzShape="circle" type="button" (click)="draftTitle.set(title()); editingTitle.set(true)" aria-label="עריכת כותרת"><span nz-icon nzType="edit"></span></button>
    }
  }
  <span class="spacer"></span>
  <button nz-button type="button" nz-dropdown [nzDropdownMenu]="exportMenu" [nzLoading]="exporting()"><span nz-icon nzType="download"></span> ייצוא</button>
  <nz-dropdown-menu #exportMenu="nzDropdownMenu">
    <ul nz-menu>
      <li nz-menu-item (click)="export('png')">תמונה (PNG)</li>
      <li nz-menu-item (click)="export('jpeg')">תמונה (JPEG)</li>
      <li nz-menu-item (click)="export('txt')">טקסט (TXT)</li>
    </ul>
  </nz-dropdown-menu>
</header>

@if (events() === null) {
  <div class="loading"><nz-spin nzSimple /></div>
} @else if (!sorted().length) {
  <nz-empty nzNotFoundImage="simple" nzNotFoundContent="אין סיכומים עם תאריך אירוע בסדרה הזו" />
} @else {
  <div class="viewport" (wheel)="onWheel($event)">
    <ol class="track" #track>
      <li class="track-title">{{ title() }}</li>
      @for (s of sorted(); track s._id; let odd = $odd) {
        <li class="event" [class.up]="odd" [class.current]="s._id === current._id">
          <button type="button" class="card" (click)="open(s)" [style.border-color]="s.color || null">
            <span class="date">{{ date(s) }}</span>
            <span class="name">{{ s.title }}</span>
          </button>
          <span class="dot" [style.background]="s.color || null"></span>
        </li>
      }
    </ol>
  </div>
}
