@if (stats(); as s) {
  <span class="shown">מוצגות {{ shown() }} מתוך {{ s.total }}</span>
  @if (s.hidden) {
    <span
      class="hidden"
      tabindex="0"
      nz-popover
      nzPopoverTrigger="hover"
      nzPopoverPlacement="bottomRight"
      [nzPopoverContent]="map"
      [attr.aria-label]="s.hidden + (searching() ? ' תמציות שתואמות לחיפוש חסומות בגלל הרשאות' : ' תמציות חסומות בגלל הרשאות')"
    >
      <span nz-icon nzType="lock"></span> {{ s.hidden }} חסומות
    </span>
  }

  <ng-template #map>
    <div class="map">
      <div class="map-title">{{ s.hidden }} תמציות {{ searching() ? 'שתואמות לחיפוש ו' : 'ש' }}אין לך הרשאה לראות</div>
      <ul class="rows">
        @for (m of s.missing; track m.permission._id) {
          <li class="row">
            <span class="name"><span class="dot" [style.background]="m.permission.color"></span>{{ m.permission.name }}</span>
            <span class="num">{{ m.blocking }}</span>
          </li>
        }
      </ul>
    </div>
  </ng-template>
}
