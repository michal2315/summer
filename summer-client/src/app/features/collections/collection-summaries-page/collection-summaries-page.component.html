@if (collection(); as c) {
  <app-summary-browser [ownerId]="userId()!" [collection]="c" [searchPlaceholder]="'חיפוש בתוך ' + c.name" [detailAside]="!embedded()">
    <div browser-header class="header">
      @if (!embedded()) {
        <a routerLink="/collections" class="back"><span nz-icon nzType="arrow-right"></span> לקטים</a>
      }
      <div class="page-title" role="heading" aria-level="1"><span nz-icon nzType="folder-open"></span> {{ c.name }}</div>
      <span class="perms">
        @for (p of c.permissions; track p._id) {
          <span class="perm"><span class="dot" [style.background]="p.color"></span>{{ p.name }}</span>
        }
      </span>
      <span class="spacer"></span>
      @if (isManager()) {
        <button nz-button type="button" (click)="edit(c)"><span nz-icon nzType="edit"></span> עריכה</button>
      }
      <a nz-button nzType="primary" routerLink="/summaries/new"><span nz-icon nzType="plus"></span> תמצית חדשה</a>
    </div>
  </app-summary-browser>
} @else {
  <div class="loading"><nz-skeleton [nzActive]="true" /></div>
}
