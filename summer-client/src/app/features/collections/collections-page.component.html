<app-resizable-page storageKey="collectionsWidth" [asideOpen]="!!selectedId()" (closeAside)="close()">
  <div main class="main">
    <div class="search-row">
      <nz-input-group [nzPrefix]="searchIcon" class="search">
        <input nz-input placeholder="חיפוש אוספים" [ngModel]="text()" (ngModelChange)="onText($event)" aria-label="חיפוש אוספים" />
      </nz-input-group>
      <ng-template #searchIcon><span nz-icon nzType="search"></span></ng-template>
      <app-notification-bell />
    </div>

    <header class="header">
      <h1 class="page-title">אוספים</h1>
      <label class="mine"><nz-switch nzSize="small" [ngModel]="!all()" (ngModelChange)="all.set(!$event)" /> רק אוספים שאני מנהל/ת</label>
      <span class="spacer"></span>
      <button nz-button nzType="primary" type="button" (click)="create()"><span nz-icon nzType="plus"></span> אוסף חדש</button>
    </header>

    <div class="list" role="list" aria-label="אוספים">
      @for (c of items(); track c._id) {
        <app-collection-card
          role="listitem"
          [collection]="c"
          [active]="c._id === selectedId()"
          [pinned]="pinned().has(c._id)"
          [favorite]="favorites().has(c._id)"
          (selected)="select($event)"
          (opened)="open($event)"
          (pinToggle)="togglePin($event)"
          (favoriteToggle)="toggleFavorite($event)"
        />
      }
      @if (loading()) {
        <div class="loader"><nz-spin nzSimple /></div>
      } @else if (!items().length) {
        <nz-empty nzNotFoundImage="simple" nzNotFoundContent="לא נמצאו אוספים" />
      }
      @if (!done()) {
        <div class="sentinel" (appInView)="loadMore()"></div>
      }
    </div>
  </div>

  <div aside>
    @if (selectedId(); as id) {
      <app-selected-collection [collectionId]="id" (closed)="close()" />
    } @else {
      <nz-empty class="no-selection" nzNotFoundImage="simple" nzNotFoundContent="בחרו אוסף מהרשימה כדי לראות את פרטיו" />
    }
  </div>
</app-resizable-page>
