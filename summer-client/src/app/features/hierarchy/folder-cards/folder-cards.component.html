<div class="cards">
  @for (f of shown(); track f._id) {
    @let count = totals().get(f._id) ?? 0;
    <a class="card" routerLink="/summaries" [queryParams]="{ folderId: f._id }">
      <span class="icon" nz-icon nzType="folder"></span>
      <span class="text">
        <span class="name">{{ f.name }}</span>
        <span class="count">{{ count === 1 ? 'תמצית אחת' : count + ' תמציות' }}</span>
      </span>
    </a>
  }
</div>
@if (hiddenCount() > 0) {
  <button type="button" class="more" (click)="expanded.set(!expanded())" [attr.aria-expanded]="expanded()">
    {{ expanded() ? 'הצגת פחות' : 'עוד ' + hiddenCount() + ' תיקיות' }}
    <span nz-icon [nzType]="expanded() ? 'up' : 'down'"></span>
  </button>
}
