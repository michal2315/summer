<label for="add-summaries">תמציות</label>
<nz-select
  nzId="add-summaries"
  nzMode="multiple"
  nzShowSearch
  nzServerSearch
  nzPlaceHolder="חיפוש תמצית לפי כותרת"
  [ngModel]="summaries()"
  (ngModelChange)="summaries.set($event)"
  (nzOnSearch)="summaryQuery$.next($event)"
>
  @for (s of summaryOptions(); track s._id) {
    <nz-option [nzValue]="s._id" [nzLabel]="s.name" />
  }
</nz-select>

<div class="muted note">תמצית שכבר נמצאת בתיקיות אחרות תישאר גם בהן.</div>
<div class="footer">
  <button nz-button type="button" (click)="modal.close(false)">ביטול</button>
  <button nz-button nzType="primary" type="button" [disabled]="!summaries().length" [nzLoading]="busy()" (click)="add()">
    הוספה
  </button>
</div>
