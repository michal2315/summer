<div class="toolbar">
  <span class="muted intro">
    {{ queries.queries().length }} חיפושים שמורים
    @if (sharedCount()) {
      · {{ sharedCount() }} משותפים
    }
  </span>
  <span class="spacer"></span>
  <a nz-button nzType="link" nzSize="small" routerLink="create"><span nz-icon nzType="plus"></span> חיפוש חדש</a>
</div>

@if (queries.queries().length > 5) {
  <nz-input-group [nzPrefix]="searchIcon" class="filter">
    <input nz-input placeholder="סינון החיפושים" [ngModel]="filter()" (ngModelChange)="filter.set($event)" aria-label="סינון החיפושים השמורים" />
  </nz-input-group>
  <ng-template #searchIcon><span nz-icon nzType="search"></span></ng-template>
}

@if (queries.list() === null) {
  <app-skeleton variant="rows" [count]="5" />
} @else {
  <ul class="list">
    @for (q of page.items(); track q._id) {
      <li class="item">
        <button type="button" class="text" (click)="run(q)" nz-tooltip="פתיחת החיפוש בפיד" nzTooltipPlacement="left">
          <span class="name">
            @if (q.isFavorite) {
              <span class="fav" nz-icon nzType="star" nzTheme="fill" aria-label="מועדף"></span>
            }
            <span class="kind" nz-icon [nzType]="q.kind === 'advanced' ? 'apartment' : 'search'" [attr.aria-label]="kindLabel[q.kind]"></span>
            {{ q.name }}
          </span>
          <span class="desc">{{ describe(q.search) }}</span>
          @if (q.isShared) {
            <span class="shared-line">
              <span nz-icon nzType="team"></span> משותף
              @if (q.followers) {
                · {{ q.followers === 1 ? 'עוקב/ת אחד/ת' : q.followers + ' עוקבים' }}
              }
            </span>
          }
        </button>
        <span class="row-actions">
          <button
            nz-button
            nzType="text"
            nzShape="circle"
            nzSize="small"
            type="button"
            class="star"
            [class.on]="q.isFavorite"
            [disabled]="isBusy(q)"
            (click)="toggleFavorite(q)"
            [nz-tooltip]="q.isFavorite ? 'הסרה מהמועדפים' : 'מועדף: מופיע ראשון ברשימות ובהצעות'"
            aria-label="מועדף"
            [attr.aria-pressed]="q.isFavorite"
          >
            <span nz-icon nzType="star" [nzTheme]="q.isFavorite ? 'fill' : 'outline'"></span>
          </button>
          <button
            nz-button
            nzType="text"
            nzShape="circle"
            nzSize="small"
            type="button"
            class="bell"
            [class.on]="q.alert?.isActive"
            [disabled]="isBusy(q)"
            (click)="toggleAlert(q)"
            [nz-tooltip]="q.alert ? 'ביטול ההתראה' : 'התראה על תמציות חדשות שמתאימות לחיפוש'"
            aria-label="התראה על החיפוש"
            [attr.aria-pressed]="!!q.alert"
          >
            <span nz-icon [nzType]="q.alert && !q.alert.isActive ? 'pause-circle' : 'bell'" [nzTheme]="q.alert?.isActive ? 'fill' : 'outline'"></span>
          </button>
          <button
            nz-button
            nzType="text"
            nzShape="circle"
            nzSize="small"
            type="button"
            class="share"
            [class.on]="q.isShared"
            [disabled]="isBusy(q)"
            nz-popconfirm
            [nzCondition]="!(q.isShared && q.followers)"
            [nzPopconfirmTitle]="unshareTitle(q)"
            nzOkText="הפסקת השיתוף"
            nzCancelText="חזרה"
            (nzOnConfirm)="toggleShared(q)"
            [nz-tooltip]="q.isShared ? 'הפסקת השיתוף' : 'שיתוף: כולם יוכלו למצוא את החיפוש, להריץ אותו ולקבל עליו התראות'"
            aria-label="שיתוף החיפוש"
            [attr.aria-pressed]="q.isShared"
          >
            <span nz-icon nzType="team"></span>
          </button>
          <a nz-button nzType="text" nzShape="circle" nzSize="small" [routerLink]="[q._id, 'edit']" nz-tooltip="עריכת החיפוש וההתראה" aria-label="עריכה">
            <span nz-icon nzType="edit"></span>
          </a>
          <button
            nz-button
            nzType="text"
            nzShape="circle"
            nzSize="small"
            nzDanger
            type="button"
            [disabled]="isBusy(q)"
            nz-popconfirm
            [nzPopconfirmTitle]="q.alert || q.followers ? 'למחוק את החיפוש? גם ההתראות עליו יימחקו.' : 'למחוק את החיפוש?'"
            nzOkText="מחיקה"
            nzCancelText="חזרה"
            (nzOnConfirm)="remove(q)"
            nz-tooltip="מחיקה"
            aria-label="מחיקה"
          >
            <span nz-icon nzType="delete"></span>
          </button>
        </span>
      </li>
    } @empty {
      <nz-empty nzNotFoundImage="simple" [nzNotFoundContent]="filter() ? 'אין חיפוש תואם' : 'עדיין אין חיפושים שמורים. שומרים חיפוש מתיבת החיפוש, או יוצרים חיפוש חדש כאן.'" />
    }
  </ul>
  @if (page.hasMore()) {
    <div class="sentinel" (appInView)="page.more()" [appInViewKey]="page.items().length"></div>
  }
}
