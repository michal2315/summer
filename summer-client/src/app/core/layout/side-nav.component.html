<nav class="nav" aria-label="ניווט ראשי">
  <a routerLink="/summaries" class="logo" (click)="navigate.emit()">
    <img src="logos/summer-full-logo.svg" alt="Summer" />
  </a>

  @if (user(); as u) {
    <a class="user" [routerLink]="['/profile', u._id]" (click)="navigate.emit()">
      <app-avatar [user]="u" [size]="32" />
      <span class="who">
        <strong>{{ u.fullName }}</strong>
        <small>{{ u.department }}</small>
      </span>
    </a>
  }

  <ul class="links">
    @for (item of items(); track item.label) {
      <li>
        <a [routerLink]="item.link" routerLinkActive="active" (click)="navigate.emit()">
          <span nz-icon [nzType]="item.icon"></span>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>

  <div class="footer">
    <button type="button" (click)="whatsNew.open()"><span nz-icon nzType="gift"></span> מה חדש</button>
    <a [href]="contactHref"><span nz-icon nzType="mail"></span> צרו קשר במייל</a>
    @if (canLogout) {
      <button type="button" (click)="logout()"><span nz-icon nzType="logout"></span> התנתקות</button>
    }
    <small class="credit">פותח ב-💗 על ידי האוניברסיטה</small>
  </div>
</nav>
