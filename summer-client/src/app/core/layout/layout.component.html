<nz-layout class="shell">
  <nz-sider
    class="sider"
    nzWidth="180px"
    nzTheme="light"
    nzBreakpoint="lg"
    [nzCollapsedWidth]="0"
    nzCollapsible
    [(nzCollapsed)]="collapsed"
  >
    <app-side-nav (navigate)="onNavigate()" />
  </nz-sider>
  <nz-content class="content">
    <router-outlet />
  </nz-content>
</nz-layout>
