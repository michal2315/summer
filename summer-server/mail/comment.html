<!--
  A quoted comment (comment on your summary, mention). Vars: author, comment.
-->
<div dir="rtl" style="margin:12px 0 4px 0;padding:10px 14px;border-right:3px solid #ff9155;background-color:#fff5ee;border-radius:6px;font-family:Arial,Helvetica,sans-serif;text-align:right;">
  <div style="font-size:12px;font-weight:bold;color:#c2571b;margin-bottom:4px;">{{author}} כתב/ה:</div>
  <div style="font-size:14px;line-height:1.6;color:#01004f;white-space:pre-wrap;">{{comment}}</div>
</div>
