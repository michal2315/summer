<!--
  The summary an e-mail is about. Vars: url, title, meta (type · author · date), labels (HTML chips), excerpt.
  Inline styles and tables only (see layout.html).
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:14px 0 4px 0;border:1px solid #e8e8ef;border-radius:10px;background-color:#f7f7fa;">
  <tr>
    <td dir="rtl" style="padding:14px 16px;font-family:Arial,Helvetica,sans-serif;text-align:right;">
      <a href="{{url}}" style="font-size:16px;font-weight:bold;color:#01004f;text-decoration:none;">{{title}}</a>
      <div style="margin-top:4px;font-size:13px;color:#6b6b80;">{{meta}}</div>
      {{{labels}}}
      <div style="margin-top:8px;font-size:14px;line-height:1.6;color:#3a3a55;">{{excerpt}}</div>
    </td>
  </tr>
</table>
