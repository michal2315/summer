<!--
  Which alert a mail is about and why it matched. Vars: name, why (HTML list items), found (HTML chips, may be empty).
  Inline styles and tables only (see layout.html).
-->
<div dir="rtl" style="margin:12px 0 4px 0;padding:10px 14px;border-right:3px solid #e8253d;background-color:#fff0f2;border-radius:6px;font-family:Arial,Helvetica,sans-serif;text-align:right;">
  <div style="font-size:12px;font-weight:bold;color:#e8253d;margin-bottom:4px;">ההתראה "{{name}}" מתריעה על תמציות:</div>
  <ul style="margin:0;padding:0 18px 0 0;font-size:14px;line-height:1.6;color:#01004f;">{{{why}}}</ul>
  {{{found}}}
</div>
